version: 2

project_name: faro

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/faro
    binary: faro
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.defaultBaseURL=https://api.farohelm.com
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - repository:
      owner: beamlabco
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/beamlabco/faro-helm-cli"
    description: "CLI tool for team standups, attendance tracking, and leave management"
    license: "MIT"
    install: |
      bin.install "faro"
    test: |
      assert_match version.to_s, shell_output("#{bin}/faro --version")
